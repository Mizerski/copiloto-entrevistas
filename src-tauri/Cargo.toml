[package]
name = "copiloto-entrevistas"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "copiloto_entrevistas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasapi = "0.26.0"
sysinfo = "0.39.6"
hound = "3.5.1"
tokio = { version = "1.53.2", features = ["sync", "time", "macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
url = "2.5.8"
keyring-core = "1.0.1"
windows-native-keyring-store = { version = "1.1.0", default-features = false }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.5", features = ["json"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
